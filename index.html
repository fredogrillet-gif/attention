<style>
:root{
  --green:#9ec10f; --green-d:#6f8a06; --blue:#1b8fe0; --blue-d:#0f66a8; --orange:#f26a1b; --yellow:#f9b61f;
  --navy:#17203d; --cream:#fffaf0; --card:#ffffff; --red:#e0413a; --ok:#2e9e4f;
  --radius:22px; --shadow:0 6px 0 rgba(23,32,61,.12), 0 14px 30px rgba(23,32,61,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;color:var(--navy);background:var(--cream);line-height:1.5;font-size:18px;
  background-image:radial-gradient(circle at 10% 10%,rgba(27,143,224,.10) 0 90px,transparent 91px),radial-gradient(circle at 92% 30%,rgba(158,193,15,.14) 0 120px,transparent 121px),radial-gradient(circle at 15% 80%,rgba(249,182,31,.14) 0 100px,transparent 101px);
  background-attachment:fixed}
h1,h2,h3{line-height:1.15;margin:0 0 .4em}
h2{font-size:clamp(1.6rem,4vw,2.2rem)}
h3{font-size:1.2rem}
p{margin:.3em 0 .6em}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* Header */
.hero{text-align:center;padding:26px 0 8px}
.hero img.logo{width:min(300px,62vw);height:auto;display:block;margin:0 auto 6px;border-radius:28px}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);color:var(--navy)}
.hero h1 span{color:var(--blue)}
.hero p.sub{font-size:1.2rem;max-width:640px;margin:.2em auto 0}
nav.top{position:sticky;top:0;z-index:20;background:rgba(255,250,240,.94);backdrop-filter:blur(6px);border-bottom:3px solid var(--navy);margin-top:18px}
nav.top .wrap{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
nav.top .links{display:flex;gap:6px;flex-wrap:wrap}
nav.top a{color:var(--navy);text-decoration:none;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid transparent}
nav.top a:hover,nav.top a:focus-visible{border-color:var(--navy);background:#fff}
.starbox{font-weight:700;background:var(--yellow);border:2px solid var(--navy);border-radius:999px;padding:4px 14px;white-space:nowrap}

section{padding:42px 0 8px}
.lead{font-size:1.12rem;max-width:760px}
.badge{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:3px 14px;font-size:.85rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}

/* Cards */
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--card);border:3px solid var(--navy);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card .ico{font-size:2.6rem;line-height:1;display:block;margin-bottom:6px}
.card h3{margin-bottom:.25em}
.ex{background:#f3f8dc;border-left:6px solid var(--green);border-radius:10px;padding:6px 10px;font-size:.95rem;margin-top:8px}
.t-conj{border-top:12px solid var(--blue)} .t-sel{border-top:12px solid var(--orange)} .t-part{border-top:12px solid var(--green)} .t-alt{border-top:12px solid var(--yellow)}
.lv1{border-top:12px solid var(--green)} .lv2{border-top:12px solid var(--yellow)} .lv3{border-top:12px solid var(--red)}
.alert{border-color:var(--red);background:#fff4f2}
.gauge{width:150px;max-width:100%;display:block;margin:0 auto 6px}
.b3{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.b3 span{background:var(--red);color:#fff;font-weight:700;border-radius:12px;padding:3px 12px}
.strat .ico{background:#eaf5ff;border-radius:50%;width:70px;height:70px;display:grid;place-items:center;font-size:2.2rem}

/* Game tabs */
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0}
.tab{background:#fff;border:3px solid var(--navy);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 4px 0 rgba(23,32,61,.18);transition:transform .1s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{background:var(--blue);color:#fff}
.tab .ti{font-size:2rem;display:block}
.tab b{display:block;font-size:.98rem;line-height:1.2}
.tab small{display:block;color:var(--orange);font-weight:700;letter-spacing:.1em;margin-top:3px}
.tab[aria-selected="true"] small{color:var(--yellow)}
.panel{background:#fff;border:3px solid var(--navy);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);min-height:320px}
.panel[hidden]{display:none}
.panel h3{font-size:1.5rem}
.rules{background:#eaf5ff;border-radius:14px;padding:10px 14px;margin:10px 0 16px}
.big{background:var(--green);color:var(--navy);border:3px solid var(--navy);border-radius:999px;padding:10px 26px;font-weight:700;font-size:1.1rem;box-shadow:0 4px 0 var(--navy)}
.big:hover{filter:brightness(1.07)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.big.alt{background:var(--yellow)}

.prog{display:flex;align-items:center;gap:12px;font-weight:700;margin-bottom:10px}
.prog .bar{flex:1;height:14px;background:#e6ebf3;border-radius:99px;overflow:hidden;border:2px solid var(--navy)}
.prog .bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.q{font-size:1.3rem;font-weight:700;margin:10px 0 14px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.choice{background:#fff;border:3px solid var(--navy);border-radius:16px;padding:12px 10px;font-weight:700;box-shadow:0 4px 0 rgba(23,32,61,.25)}
.choice:hover:not(:disabled){background:#eaf5ff}
.choice:disabled{cursor:default}
.choice.good{background:#d8f3de;border-color:var(--ok)}
.choice.bad{background:#ffe0dd;border-color:var(--red)}
.fb{min-height:56px;margin-top:14px;font-weight:700}
.fb .exp{font-weight:400;display:block;margin-top:2px}
.fb .ok{color:var(--ok)} .fb .ko{color:var(--red)}
.result{text-align:center;padding:10px 0}
.result .stars{font-size:3rem;color:var(--yellow);text-shadow:0 2px 0 var(--navy);letter-spacing:.1em}
.result ul{list-style:none;padding:0;margin:10px auto 16px;max-width:420px;text-align:left}
.result li{padding:4px 0;border-bottom:2px dotted #c9d1df}

.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;margin-bottom:10px}
.hud span{background:#eaf5ff;border-radius:999px;padding:3px 14px}

/* Hunt game */
.band{position:relative;height:64px;border-radius:14px;background:linear-gradient(90deg,#eef6ff,#fff7e4);border:2px dashed #9db3d1;overflow:hidden;margin-bottom:12px}
.dstr{position:absolute;border:none;background:transparent;font-size:2rem;padding:0}
.d-move{top:10px;left:0;animation:fly 4.2s linear infinite alternate}
.d-shine{top:10px;left:46%;animation:blink .55s steps(2) infinite}
.d-noise{top:14px;right:8%;font-size:1.1rem;font-weight:900;color:#fff;background:var(--red);border-radius:14px;padding:6px 12px;animation:wob .35s ease-in-out infinite alternate}
@keyframes fly{from{left:0}to{left:calc(100% - 50px)}}
@keyframes blink{0%{opacity:1;filter:drop-shadow(0 0 12px gold)}100%{opacity:.15}}
@keyframes wob{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(6deg) scale(1.15)}}
.hgrid{display:grid;gap:6px}
.tile{font-size:clamp(1.3rem,4.4vw,2.1rem);background:#fff;border:2px solid #b8c4d8;border-radius:12px;padding:4px 0;line-height:1.2}
.tile:hover{background:#fff7e4}
.tile.found{background:#d8f3de;border-color:var(--ok);cursor:default}
.tile.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.toast{color:var(--red);font-weight:700;min-height:28px;margin-top:10px}

/* Dual */
.dual{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.dual{grid-template-columns:1fr}}
.field{position:relative;min-height:240px;background:#eaf7da;border:3px dashed var(--green-d);border-radius:18px;overflow:hidden}
.bee{position:absolute;font-size:2.6rem;background:none;border:none;animation:pop .2s}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}

/* Switch */
.rule{border-radius:16px;padding:12px;text-align:center;font-weight:700;font-size:1.25rem;color:#fff;margin-bottom:12px}
.rule.r0{background:var(--blue)} .rule.r1{background:var(--orange)}
.cardbig{font-size:4rem;font-weight:900;text-align:center;letter-spacing:.2em;background:#fff;border:4px solid var(--navy);border-radius:20px;max-width:260px;margin:0 auto 14px;padding:10px 0}
.yn{display:flex;gap:14px;justify-content:center}
.yn .choice{min-width:130px;font-size:1.3rem}

/* Breathing */
.breath{display:grid;place-items:center;padding:10px}
.circle{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bfe3ff,var(--blue));border:4px solid var(--navy);display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.2rem;text-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform 4s ease-in-out}
.circle.in{transform:scale(1.35)}

details{margin-top:14px}
summary{cursor:pointer;font-weight:700}
footer{margin-top:50px;background:var(--navy);color:#fff;text-align:center;padding:26px 18px}
footer img{width:110px;height:auto;background:#fff;border-radius:50%;padding:4px;margin-bottom:6px}
footer a{color:var(--yellow)}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:4px solid var(--orange);outline-offset:2px}
@media print{nav.top,.panel,.tabs,footer{display:none}}

/* Activités */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.chip{background:#fff;border:3px solid var(--navy);border-radius:999px;padding:6px 16px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff}
.acard{display:flex;flex-direction:column;gap:2px}
.acard .tag{align-self:flex-start;background:var(--navy);color:#fff;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700}
.acard .meta{font-size:.9rem;color:#4b5675}
.acard .big{margin-top:auto;align-self:flex-start}
.acard h3{margin-top:8px}
#proj{position:fixed;inset:0;z-index:100;background:var(--cream);display:flex;flex-direction:column;--pz:1}
#proj[hidden]{display:none}
.phead,.pfoot{background:var(--navy);color:#fff;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 18px;flex-wrap:wrap}
.phead h2{margin:0;font-size:1.2rem}
.phead .pt{display:flex;gap:8px}
.pbtn{background:#fff;color:var(--navy);border:3px solid var(--yellow);border-radius:12px;padding:4px 14px;font-weight:700}
.pbtn:disabled{opacity:.4;cursor:default}
#pbody{flex:1;overflow:auto;padding:26px clamp(18px,5vw,70px);font-size:calc(1.3rem*var(--pz))}
.stitle{font-size:1.7em;color:var(--blue-d);border-bottom:5px solid var(--yellow);display:inline-block;padding-bottom:4px;margin-bottom:.6em}
.sbody p,.sbody li{margin:.35em 0}
.pbox{background:#fff;border:4px solid var(--navy);border-radius:20px;padding:14px 22px;margin:14px 0}
.pbox.txt{font-size:1.1em;line-height:1.7;background:#fffdf3}
.pq{font-size:1.15em;font-weight:700}
.lv3col{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;text-align:center}
.lv3col .gauge{width:min(190px,100%)}
.w{margin:18px 0}
.w-timer{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.clock{font-size:3.2em;font-weight:900;font-variant-numeric:tabular-nums;color:var(--navy);background:#fff;border:4px solid var(--navy);border-radius:20px;padding:0 28px;min-width:200px;text-align:center}
.clock.flash{animation:flash .6s steps(2) infinite;color:#fff;background:var(--red)}
@keyframes flash{50%{opacity:.5}}
.wbtn{display:flex;gap:10px;flex-wrap:wrap}
.cuenote{font-size:.55em;color:#8a93a8;min-height:1.4em}
.plan{font-size:.6em;color:#4b5675}
.answer{background:#e9f7ea;border:4px solid var(--ok);border-radius:18px;padding:12px 20px;margin-top:10px;font-weight:600}
.w-find .fg{display:grid;gap:3px;font-family:"Courier New",monospace;font-size:1.7em;font-weight:700;background:#fff;border:4px solid var(--navy);border-radius:16px;padding:10px;max-width:760px;text-align:center;margin-bottom:10px}
.w-find .fg span.hit{background:var(--orange);color:#fff;border-radius:6px}
.fgcount{font-weight:700;color:var(--green-d)}
.w-shape .shapebox svg{width:min(460px,100%);height:auto;display:block;margin-bottom:10px}
.lvcard{background:#fff;border:4px solid var(--navy);border-radius:20px;padding:14px 22px;max-width:760px}
.lvn{font-size:.65em;font-weight:700;color:var(--blue-d);text-transform:uppercase}
.lvans{display:flex;gap:18px;align-items:center;margin:10px 0}
.lvans .gauge{width:150px;flex:none}
@media print{#proj{display:none}}

/* ===== Parcours ===== */
body{padding:0}
.apptop{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:6px 16px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:900;font-size:1.15rem}
.brand img{height:44px;width:44px;border-radius:12px;background:#fff;object-fit:cover}
.topr{display:flex;gap:10px;align-items:center}
.pbtn2{background:var(--yellow);color:var(--navy);border:3px solid #fff;border-radius:12px;padding:3px 12px;font-weight:700;text-decoration:none}
.hero{padding-top:30px}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:22px 0 4px}
.prog .bar{flex:1;min-width:180px;height:16px;background:#e6ebf3;border-radius:99px;overflow:hidden;border:2px solid var(--navy)}
.prog .bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.chapter{padding:26px 0 4px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.mcard{display:flex;flex-direction:column;gap:2px;background:#fff;border:3px solid var(--navy);border-radius:20px;padding:14px 16px 14px 74px;position:relative;text-decoration:none;color:var(--navy);box-shadow:var(--shadow);min-height:112px;transition:transform .12s}
.mcard:hover,.mcard:focus-visible{transform:translateY(-3px)}
.mcard .mnum{position:absolute;left:14px;top:14px;width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;font-size:1.3rem;display:grid;place-items:center}
.mcard.done .mnum{background:var(--ok)}
.mcard.final .mnum{background:var(--yellow);color:var(--navy);font-size:1.5rem}
.mcard small{color:#4b5675;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mcard b{font-size:1.15rem;line-height:1.2}
.mcard .mq{color:var(--orange);font-weight:700}
.mcard .rev{color:var(--green-d);font-weight:700}
.mshell{max-width:1080px;margin:0 auto;padding:0 18px 20px;--pz:1}
.mbar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
.mbar h2{margin:0;font-size:clamp(1.5rem,4vw,2.1rem)}
.mtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#achips{display:flex;gap:6px;flex-wrap:wrap}
#achips .chip{padding:4px 12px;font-size:.9rem}
.pbtn.dark{background:#fff;color:var(--navy);border-color:var(--navy)}
#pbody{overflow:visible;padding:8px 0 28px;min-height:48vh;font-size:calc(1.3rem*var(--pz))}
.pfoot{position:sticky;bottom:0;border-radius:16px 16px 0 0;z-index:10}
.disc{background:#fff;border:4px solid var(--green);border-radius:24px;padding:18px 28px;margin:10px 0 18px;box-shadow:var(--shadow)}
.disc .ico{font-size:3.4rem;line-height:1}
.disc h3{font-size:1.5em;color:var(--green-d)}
.disc .gauge{width:170px;display:block;margin:0 0 6px}
.dact{margin-top:6px}
a.big{text-decoration:none;display:inline-block;color:var(--navy)}
.flipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.flip{background:#fff;border:4px solid var(--navy);border-radius:18px;padding:14px;min-height:140px;font-size:.9em;font-weight:700;text-align:left;box-shadow:0 4px 0 rgba(23,32,61,.2)}
.flip.on{background:#e9f7ea;border-color:var(--ok)}
.strl{list-style:none;padding:0}.strl li{padding:6px 0;border-bottom:2px dotted #c9d1df}
.card .gauge{width:150px}
.printonly{display:none}
@media(max-width:520px){.brand span{display:none}.apptop{padding:6px 10px}.pbtn2{padding:3px 9px}.starbox{padding:3px 9px;font-size:.9rem}}
@media print{
  body{background:#fff}
  .apptop,.noprint,.pfoot,footer{display:none!important}
  .printonly{display:block}
  .card{box-shadow:none;break-inside:avoid}
}
</style>

const G=l=>`<svg class="gauge" viewBox="0 0 140 90" data-lv="${l}"></svg>`;
const CONCEPTS={
 conjointe:{icon:"🤝",name:"L’attention conjointe",html:`<p>Je travaille avec quelqu’un sur une tâche précise : un camarade, mon enseignant ou un parent. Mon attention et la sienne se dirigent vers la <b>même tâche</b>.</p><div class="ex">Exemple : je cherche la solution d’un problème avec mon voisin.</div>`},
 selective:{icon:"🎯",name:"L’attention sélective",html:`<p>Je fais l’effort de <b>choisir ce qui est utile</b> et je laisse le reste de côté.</p><div class="ex">Exemple : je prends seulement le matériel dont j’ai besoin, ou je choisis la bonne réponse parmi plusieurs.</div>`},
 partagee:{icon:"🤹",name:"L’attention partagée",html:`<p>Je fais <b>deux choses presque en même temps</b>. C’est possible quand l’une des deux est devenue un <b>automatisme</b>.</p><div class="ex">Exemple : j’écris la date pendant que j’écoute la consigne.</div>`},
 alternee:{icon:"🔄",name:"L’attention alternée",html:`<p>Je me concentre sur une tâche, puis sur une autre, et je <b>passe de l’une à l’autre</b> sans me perdre.</p><div class="ex">Exemple : je regarde le tableau, j’écris dans mon cahier, puis je regarde à nouveau le tableau.</div>`},
 niv1:{icon:"🟢",name:"Niveau 1 : la base",html:`${G(1)}<p>J’écoute l’enseignant, je me mets au travail, je sors mes affaires et je laisse mes « petites histoires » en dehors de la classe.</p>`},
 niv2:{icon:"🟡",name:"Niveau 2 : modéré",html:`${G(2)}<p>Je travaille en groupe, je participe, je donne mon avis en écoutant les autres, ou je fais un exercice. Ça demande de l’énergie.</p>`},
 niv3:{icon:"🔴",name:"Niveau 3 : soutenu",html:`${G(3)}<p>Exercice compliqué, dictée, production d’écrit, gros calcul… Le travail est difficile et ça demande <b>beaucoup d’énergie</b> !</p>`},
 alerte:{icon:"🚨",name:"L’alerte : les 3 B",html:`<p>Mon cerveau réagit tout seul : c’est un <b>automatisme</b> ! Je me déconnecte de mon travail si je rencontre un des <b>3 B</b> :</p><div class="b3"><span>Ce qui Bouge</span><span>Ce qui Brille</span><span>Ce qui fait du Bruit</span></div><p>Ça me distrait !</p>`},
 degres:{icon:"📈",name:"Les 3 degrés de l’attention",html:`<div class="lv3col"><div>${G(1)}<b>Niveau 1 : la base</b><br>J’écoute, je me mets au travail.</div><div>${G(2)}<b>Niveau 2 : modéré</b><br>Groupe, participation, exercice.</div><div>${G(3)}<b>Niveau 3 : soutenu</b><br>Dictée, production d’écrit, gros calcul.</div></div><p>Plus c’est difficile, plus il me faut d’énergie. Et l’alerte des <b>3 B</b> peut tout interrompre !</p>`},
 strategies:{icon:"🛠️",name:"Mes stratégies pour rester concentré",html:`<ul class="strl"><li>🫧 <b>Me mettre dans ma bulle</b> : je libère ma réflexion de mes pensées distrayantes.</li><li>⏸️ <b>Faire des pauses</b> : je ne peux pas rester attentif trop longtemps, même les adultes !</li><li>🪑 <b>M’isoler</b> : je limite l’effet des bruits et des déplacements.</li><li>🎧 <b>Utiliser un casque</b> : je réduis les bruits de la classe.</li><li>🧹 <b>Éloigner les distracteurs</b> : objets rigolos, bruits inutiles…</li></ul>`}
};
const CHAPTERS=[

 {key:"degres",titre:"Partie 2 · Les degrés d’attention",sub:"Toutes les activités ne demandent pas la même énergie."},

];
const MISSIONS=[

   {titre:"Aujourd’hui : travailler à deux",html:`<div class="pbox">Je me mets avec un camarade. <b>Nous n’avons qu’un seul crayon pour deux.</b></div><ul><li>L’un lit l’énigme à voix haute, l’autre écrit.</li><li>On change les rôles à chaque énigme.</li><li>On se met d’accord avant de répondre.</li></ul>`},
   {titre:"Énigme 1",html:`<p class="pq">Un fermier a 17 moutons. <b>Tous sauf 9</b> s’enfuient. Combien de moutons lui reste-t-il ?</p>`,w:[{type:"timer",sec:90},{type:"reveal",label:"Voir la réponse",html:`<b>9 moutons.</b> « Tous sauf 9 » veut dire que 9 sont restés.`}]},
   {titre:"Énigme 2",html:`<p class="pq">Dans une course, tu dépasses le coureur qui est <b>deuxième</b>. Tu es maintenant…</p>`,w:[{type:"timer",sec:90},{type:"reveal",label:"Voir la réponse",html:`<b>Deuxième !</b> Tu prends la place du deuxième, tu ne dépasses pas le premier.`}]},

 ]},

 {titre:"J’écoute ce qui compte",duree:"12 min",materiel:"Cahier de brouillon, crayon",slides:[
   {titre:"La règle du jeu",html:`<div class="pbox">Je lis un court texte. Toi, tu notes <b>seulement</b> ce que je te demande. Tout le reste, tu le laisses passer !</div><p>Tu ne peux pas tout retenir : il va falloir <b>choisir</b>.</p>`},
   {titre:"Lecture 1 : note les NOMBRES",html:`<p>L’enseignant lit lentement :</p><div class="pbox txt">Ce matin, le marché était plein de monde. Léa a acheté trois pommes, la baguette et deux pots de miel. Son frère Hugo voulait quinze cerises, mais il n’en restait que douze. Ils ont payé huit euros et sont rentrés à quatre heures.</div>`,w:{type:"reveal",label:"Voir la correction",html:`<b>6 nombres :</b> trois, deux, quinze, douze, huit, quatre.`}},
   {titre:"Lecture 2 : note les ANIMAUX (avec du bruit !)",html:`<p>Pendant la lecture, <b>3 élèves chuchotent des mots au hasard</b> dans la classe.</p><div class="pbox txt">Dans le jardin de grand-mère, il y avait un chat noir, un pommier, deux poules et un cheval. Pendant que le lapin dormait sous la table, une poire est tombée près de la fraise.</div>`,w:{type:"reveal",label:"Voir la correction",html:`<b>4 animaux :</b> le chat, les poules, le cheval, le lapin. (Le pommier, la poire et la fraise sont des intrus !)`}},
   {titre:"On en parle",html:`<ul class="pq"><li>Qu’as-tu fait dans ta tête pour ne garder que l’information utile ?</li><li>Les chuchotements t’ont-ils gêné ?</li><li>Comment appellerais-tu cette attention qui <b>choisit</b> ?</li></ul>`}
 ]},

   {titre:"Deux essais",html:`<div class="pbox">Je vais faire <b>deux choses presque en même temps</b> : écrire, et répondre à des questions de l’enseignant dans ma tête.</div><p>Essai 1 : j’écris une phrase normalement.<br>Essai 2 : j’écris l’alphabet à l’envers.</p>`},
   {titre:"Essai 1 : écrire normalement",html:`<p>Recopie en écriture cursive :</p><div class="pbox txt">Le Labo des Savoirs est un super endroit pour apprendre.</div><p>Pendant ce temps, l’enseignant pose des questions à voix haute :</p><ul><li>Quel jour sommes-nous ?</li><li>Combien font 2 + 2 ?</li><li>Quel est ton plat préféré ?</li></ul>`,w:{type:"timer",sec:60}},

 ]}

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const starStr=n=>"★".repeat(n)+"☆".repeat(3-n);

/* ---- timers cleanup ---- */
const timers=new Set();
const later=(f,ms)=>{const t=setTimeout(()=>{timers.delete(t);f()},ms);timers.add(t);return t};
const every=(f,ms)=>{const t=setInterval(f,ms);timers.add(t);return t};
const stopAll=()=>{timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers.clear()};

/* ---- progression (étoiles des jeux + missions découvertes) ---- */
let stars={};
try{stars=JSON.parse(localStorage.getItem("labo-attention-stars")||"{}")}catch(e){stars={}}
const save=()=>{try{localStorage.setItem("labo-attention-stars",JSON.stringify(stars))}catch(e){}};
function giveStars(id,n){if((stars[id]||0)<n){stars[id]=n;save()}refreshStars()}
const isDone=id=>!!stars["m_"+id];
const markDone=id=>{if(!stars["m_"+id]){stars["m_"+id]=1;save()}};
function refreshStars(){
  const t=GAMES.reduce((s,g)=>s+(stars[g.id]||0),0),el=$("#total");
  if(el)el.textContent="⭐ "+t+" / "+GAMES.length*3;
  GAMES.forEach(g=>{const e=$("#tab-"+g.id+" small");if(e)e.textContent=starStr(stars[g.id]||0)});
}

/* ---- jauges ---- */
function gaugeInner(lv){
  const cx=70,cy=72,r=55,deg={1:-60,2:0,3:60}[lv];
  const pt=a=>[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)];
  const arc=(a1,a2,c)=>{const p=pt(a1),q=pt(a2);return `<path d="M${p[0]} ${p[1]} A${r} ${r} 0 0 1 ${q[0]} ${q[1]}" stroke="${c}" stroke-width="16" fill="none"/>`};
  return arc(180,122,"#4caf50")+arc(118,62,"#f9b61f")+arc(58,0,"#e0413a")+`<line x1="70" y1="72" x2="70" y2="26" stroke="#17203d" stroke-width="6" stroke-linecap="round" transform="rotate(${deg} 70 72)"/><circle cx="70" cy="72" r="8" fill="#17203d"/>`;
}
const fillGauges=root=>$$("svg.gauge[data-lv]",root).forEach(g=>g.innerHTML=gaugeInner(+g.dataset.lv));


/* ---- generic result card ---- */
function endCard(root,o){
  root.innerHTML=`<div class="result"><div class="stars" aria-label="${o.n} étoile(s) sur 3">${starStr(o.n)}</div><h3>${o.title}</h3><ul>${o.lines.map(l=>`<li>${l}</li>`).join("")}</ul>${o.msg?`<p>${o.msg}</p>`:""}<button class="big" id="again">Rejouer</button></div>`;
  $("#again",root).onclick=o.replay;
  giveStars(o.id,o.n);
}

/* ---- generic quiz ---- */
function runQuiz(root,id,cfg){
  stopAll();
  const pool=typeof cfg.pool==="function"?cfg.pool():cfg.pool;
  const qs=shuffle(pool).slice(0,cfg.count);
  let i=0,score=0;
  function show(){
    if(i>=qs.length)return end();
    const q=qs[i],ch=q.choices||cfg.choices;
    root.innerHTML=`<div class="prog">Question ${i+1} / ${qs.length}<span class="bar"><i style="width:${i/qs.length*100}%"></i></span></div>
      <p class="q">${q.q}</p><div class="choices">${ch.map((c,k)=>`<button class="choice" data-k="${k}">${c}</button>`).join("")}</div><div class="fb" aria-live="polite"></div>`;
    $$(".choice",root).forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,good=k===q.a;
      $$(".choice",root).forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("good")});
      if(good)score++;else b.classList.add("bad");
      $(".fb",root).innerHTML=(good?`<span class="ok">✔ Bravo !</span>`:`<span class="ko">✘ Pas tout à fait. La bonne réponse : ${ch[q.a]}</span>`)+`<span class="exp">${q.e}</span><br><button class="big" id="next" style="margin-top:8px">${i+1<qs.length?"Suivant →":"Voir mon résultat"}</button>`;
      $("#next",root).focus();
      $("#next",root).onclick=()=>{i++;show()};
    });
  }
  function end(){
    const p=score/qs.length,n=p>=.9?3:p>=.65?2:1;
    endCard(root,{id,n,title:p>=.9?"Quel champion de l’attention !":p>=.65?"Très bien joué !":"Continue, tu progresses !",
      lines:[`Bonnes réponses : <b>${score} / ${qs.length}</b>`],
      msg:cfg.endMsg,replay:()=>runQuiz(root,id,cfg)});
  }
  show();
}

/* ---- Game 1 : types ---- */
const TYPES=["🤝 Conjointe","🎯 Sélective","🤹 Partagée","🔄 Alternée"];
const POOL_TYPES=[
 {q:"Avec ton voisin, tu cherches ensemble la solution d’un problème de maths.",a:0,e:"Tu travailles avec quelqu’un sur la même tâche : c’est l’attention conjointe."},
 {q:"Pour l’exercice, tu choisis dans ta trousse seulement le matériel dont tu as besoin.",a:1,e:"Tu tries ce qui est utile : c’est l’attention sélective."},
 {q:"Tu écris la date sur ton cahier tout en écoutant la consigne de l’enseignant.",a:2,e:"Écrire la date est devenu automatique, donc tu peux faire deux choses presque en même temps : attention partagée."},
 {q:"Tu regardes le tableau, tu écris dans ton cahier, puis tu regardes de nouveau le tableau, sans te perdre.",a:3,e:"Tu passes d’une tâche à l’autre efficacement : attention alternée."},
 {q:"Dans un QCM, tu dois choisir la bonne réponse parmi quatre possibilités.",a:1,e:"Tu dois faire un choix entre plusieurs réponses : attention sélective."},
 {q:"À la maison, tu relis ton texte avec un parent pour trouver le sens d’un mot.",a:0,e:"Vous travaillez ensemble sur une tâche précise : attention conjointe."},
 {q:"Tu marches dans le couloir en discutant avec ton copain, sans réfléchir à la façon de marcher.",a:2,e:"Marcher est automatique, alors tu peux aussi parler : attention partagée."},
 {q:"Tu fais un exercice de maths, puis un exercice de français, et tu passes de l’un à l’autre facilement.",a:3,e:"Tu te focalises sur une tâche puis sur une autre : attention alternée."},
 {q:"Dans un texte, tu surlignes seulement les mots qui parlent d’animaux.",a:1,e:"Tu retiens les informations utiles et tu ignores le reste : attention sélective."},
 {q:"Avec l’enseignant, tu relis ta production d’écrit pour l’améliorer.",a:0,e:"Tu travailles avec ton enseignant sur une tâche précise : attention conjointe."},
 {q:"Dans la cour, il y a beaucoup de bruit mais tu entends seulement ton ami qui t’appelle.",a:1,e:"Tu choisis d’écouter ce qui compte : attention sélective."},
 {q:"Tu prends des notes sur ton cahier pendant que le maître explique, en pensant à bien former tes lettres sans effort.",a:2,e:"Écrire est automatisé, tu peux donc écouter en même temps : attention partagée."}
];

/* ---- Game 2 : niveaux ---- */
const LEVELS=["Niveau 1 : la base","Niveau 2 : modéré","Niveau 3 : soutenu"];
const POOL_LEVELS=[
 {q:"Tu sors ton cahier et ta trousse quand l’enseignant le demande.",a:0,e:"Se mettre au travail et sortir ses affaires : niveau 1."},
 {q:"Tu écoutes la consigne donnée par l’enseignant.",a:0,e:"Savoir écouter est le niveau de base : niveau 1."},
 {q:"Tu laisses tes « petites histoires » de la récré dehors pour te mettre au travail.",a:0,e:"C’est la préparation de base à l’attention : niveau 1."},
 {q:"Tu participes à un travail de groupe et tu écoutes l’avis des autres.",a:1,e:"Travailler en groupe et réagir : niveau 2."},
 {q:"Tu donnes ton point de vue à l’oral pendant un échange en classe.",a:1,e:"Participer et donner son avis : niveau 2."},
 {q:"Tu fais un exercice d’entraînement en classe.",a:1,e:"Faire un exercice demande de l’énergie : niveau 2."},
 {q:"Tu écris une dictée.",a:2,e:"La dictée est difficile : elle demande beaucoup d’énergie, niveau 3."},
 {q:"Tu rédiges une production d’écrit.",a:2,e:"Produire un écrit est un travail exigeant : niveau 3."},
 {q:"Tu résous un gros calcul avec plusieurs étapes.",a:2,e:"Un gros calcul demande beaucoup d’énergie : niveau 3."},
 {q:"Tu réalises un exercice très compliqué que tu ne connais pas encore.",a:2,e:"Plus c’est difficile, plus l’attention doit être soutenue : niveau 3."}
];

/* ---- Game 6 : stratégies ---- */
const STRATS=["🫧 Me mettre dans ma bulle","⏸️ Faire une pause","🪑 M’isoler","🎧 Mettre un casque","🧹 Éloigner les distracteurs"];
const POOL_STRAT=[
 {q:"Tu as des soucis plein la tête après la récré et tu n’arrives pas à te mettre au travail.",a:0,e:"La bulle aide à libérer ma réflexion des pensées qui distraient."},
 {q:"Tu travailles depuis longtemps et tu sens que ton cerveau fatigue.",a:1,e:"On ne peut pas rester attentif trop longtemps : une pause fait du bien."},
 {q:"Tes camarades se déplacent beaucoup autour de toi pendant ton exercice.",a:2,e:"M’isoler limite l’effet des déplacements des autres."},
 {q:"La classe est très bruyante pendant que tu fais une dictée.",a:3,e:"Le casque réduit les bruits de la classe."},
 {q:"Un stylo à paillettes tout rigolo t’amuse sur ta table.",a:4,e:"J’éloigne ce qui me distrait : le stylo reste dans la trousse !"},
 {q:"Tes pensées partent dans tous les sens et tu n’arrives plus à réfléchir à ton travail.",a:0,e:"Je me mets dans ma bulle pour retrouver ma réflexion."},
 {q:"Tu as fini un long travail difficile et tu n’arrives plus à fixer ton attention.",a:1,e:"Mon attention a besoin de repos : je fais une pause."},
 {q:"Il y a plein de petits objets sur ton bureau et tu joues avec au lieu de travailler.",a:4,e:"Je range les distracteurs hors de ma vue."}
].map(q=>q);
function stratPool(){
  return POOL_STRAT.map(q=>{
    const others=shuffle([0,1,2,3,4].filter(k=>k!==q.a)).slice(0,3);
    const idx=shuffle([q.a,...others]);
    return {q:q.q,e:q.e,choices:idx.map(k=>STRATS[k]),a:idx.indexOf(q.a)};
  });
}

/* ---- Game 3 : chasse aux 3B (attention sélective) ---- */
function initHunt(root){
  stopAll();
  const sets=[{t:"🍎",o:["🍅","🍒","🍓","🌶️"],name:"pommes"},{t:"🐱",o:["🐶","🐰","🐻","🐼"],name:"chats"},{t:"⭐",o:["🌟","✨","💫","🟡"],name:"étoiles jaunes"}];
  const rounds=[{cols:5,n:20,k:4,d:false},{cols:6,n:30,k:6,d:true},{cols:7,n:42,k:8,d:true}];
  root.innerHTML=`<h3>🔎 La chasse aux cibles</h3><div class="rules"><b>But :</b> trouve toutes les cibles cachées parmi les intrus (attention sélective). Mais attention : dès la manche 2, des choses vont <b>bouger, briller et faire du bruit</b> pour te distraire… Ne te laisse pas piéger !</div><button class="big" id="go">Commencer</button>`;
  $("#go",root).onclick=()=>play(0,{err:0,dis:0,time:0});
  function play(r,st){
    stopAll();
    const R=rounds[r],S=sets[r];
    let found=0,sec=0;
    const cells=shuffle([...Array(R.k).fill(S.t),...Array.from({length:R.n-R.k},()=>S.o[rnd(0,S.o.length-1)])]);
    root.innerHTML=`<div class="hud"><span>Manche ${r+1} / 3</span><span>Trouve les ${S.name} ${S.t} : <b id="fc">0</b> / ${R.k}</span><span>⏱ <b id="tm">0</b> s</span></div>
      ${R.d?`<div class="band" aria-hidden="false"><button class="dstr d-move" aria-label="Distraction : un papillon qui bouge">🦋</button><button class="dstr d-shine" aria-label="Distraction : une étoile qui brille">✨</button><button class="dstr d-noise" aria-label="Distraction : du bruit">BRRR !</button></div>`:""}
      <div class="hgrid" style="grid-template-columns:repeat(${R.cols},1fr)">${cells.map((c,k)=>`<button class="tile" data-k="${k}">${c}</button>`).join("")}</div><div class="toast" aria-live="polite"></div>`;
    every(()=>{sec++;st.time++;$("#tm",root).textContent=sec},1000);
    $$(".dstr",root).forEach(b=>b.onclick=()=>{st.dis++;$(".toast",root).textContent="Oups ! Un des 3 B (Bouge, Brille, Bruit) t’a distrait. Reviens à ta cible !"});
    $$(".tile",root).forEach(b=>b.onclick=()=>{
      const c=cells[+b.dataset.k];
      if(b.classList.contains("found"))return;
      if(c===S.t){
        b.classList.add("found");found++;$("#fc",root).textContent=found;
        if(found===R.k){stopAll();later(()=>r<2?play(r+1,st):finish(st),700)}
      }else{
        st.err++;b.classList.add("shake");later(()=>b.classList.remove("shake"),300);
        $(".toast",root).textContent="Ce n’est pas une cible, regarde bien !";
      }
    });
  }
  function finish(st){
    const bad=st.err+st.dis,n=bad<=3?3:bad<=8?2:1;
    endCard(root,{id:"hunt",n,title:"Chasse terminée !",
      lines:[`Temps total : <b>${st.time} s</b>`,`Erreurs de choix : <b>${st.err}</b>`,`Fois où un « 3 B » m’a distrait : <b>${st.dis}</b>`],
      msg:st.dis===0?"Tu as résisté aux 3 B : bravo, ton attention sélective est solide !":"Les 3 B attirent notre attention automatiquement. Essaie de les ignorer à la prochaine partie !",replay:()=>initHunt(root)});
  }
}

/* ---- Game 4 : double mission (attention partagée) ---- */
function initDual(root){
  stopAll();
  root.innerHTML=`<h3>🤹 La double mission</h3><div class="rules"><b>But :</b> fais deux choses presque en même temps pendant 40 secondes (attention partagée) :<br>🧮 à gauche, réponds aux calculs ; 🐝 à droite, attrape les abeilles avant qu’elles disparaissent !</div><button class="big" id="go">C’est parti</button>`;
  $("#go",root).onclick=run;
  function run(){
    let time=40,mOk=0,mTot=0,bees=0,caught=0,cur=null;
    root.innerHTML=`<div class="hud"><span>⏱ <b id="t">40</b> s</span><span>🧮 <b id="ms">0</b> bonnes</span><span>🐝 <b id="bs">0</b> attrapées</span></div>
      <div class="dual"><div><p class="q" id="dq"></p><div class="choices" id="dc"></div></div><div class="field" id="fd" aria-label="Zone des abeilles"></div></div>`;
    function newQ(){
      let a,b,ans,txt;
      if(Math.random()<.5){a=rnd(12,59);b=rnd(3,9);ans=a+b;txt=`${a} + ${b} = ?`}else{a=rnd(3,9);b=rnd(3,9);ans=a*b;txt=`${a} × ${b} = ?`}
      const set=new Set([ans]);while(set.size<3){const w=ans+[-10,-2,-1,1,2,10][rnd(0,5)];if(w>0)set.add(w)}
      cur=ans;$("#dq",root).textContent=txt;
      $("#dc",root).innerHTML=shuffle([...set]).map(v=>`<button class="choice" data-v="${v}">${v}</button>`).join("");
      $$("#dc .choice",root).forEach(bn=>bn.onclick=()=>{mTot++;if(+bn.dataset.v===cur){mOk++;$("#ms",root).textContent=mOk}newQ()});
    }
    function spawn(){
      const fd=$("#fd",root);if(!fd)return;fd.innerHTML="";bees++;
      const b=document.createElement("button");b.className="bee";b.textContent="🐝";b.setAttribute("aria-label","Abeille");
      b.style.left=rnd(5,75)+"%";b.style.top=rnd(5,70)+"%";
      b.onclick=()=>{caught++;$("#bs",root).textContent=caught;b.remove()};
      fd.appendChild(b);later(()=>b.remove(),1500);
    }
    newQ();later(spawn,800);every(spawn,2600);
    every(()=>{time--;$("#t",root).textContent=time;if(time<=0){stopAll();end()}},1000);
    function end(){
      const pb=bees?caught/bees:0,n=(pb>=.8&&mOk>=8)?3:(pb>=.5&&mOk>=5)?2:1;
      endCard(root,{id:"dual",n,title:"Double mission terminée !",
        lines:[`Calculs justes : <b>${mOk} / ${mTot}</b>`,`Abeilles attrapées : <b>${caught} / ${bees}</b>`],
        msg:"Faire deux choses en même temps est difficile : c’est plus facile quand l’une des deux est automatique !",replay:()=>initDual(root)});
    }
  }
}

/* ---- Game 5 : change de règle (attention alternée) ---- */
function initSwitch(root){
  stopAll();
  root.innerHTML=`<h3>🔄 Change de règle !</h3><div class="rules"><b>But :</b> une carte avec un chiffre et une lettre apparaît. La règle change à chaque carte (attention alternée) :<br>🔵 règle bleue : « Le <b>nombre</b> est-il <b>pair</b> ? »<br>🟠 règle orange : « La <b>lettre</b> est-elle une <b>voyelle</b> ? »</div><button class="big" id="go">Commencer</button>`;
  $("#go",root).onclick=run;
  function run(){
    const TOTAL=12;let i=0,ok=0,rule=rnd(0,1);
    const V="AEIOU",C="BCDFGLMRST";
    function show(){
      if(i>=TOTAL)return end();
      const num=rnd(1,9),let_=Math.random()<.45?V[rnd(0,4)]:C[rnd(0,C.length-1)];
      const ans=rule===0?num%2===0:V.includes(let_);
      root.innerHTML=`<div class="prog">Carte ${i+1} / ${TOTAL}<span class="bar"><i style="width:${i/TOTAL*100}%"></i></span></div>
        <div class="rule r${rule}">${rule===0?"🔵 Le NOMBRE est-il PAIR ?":"🟠 La LETTRE est-elle une VOYELLE ?"}</div>
        <div class="cardbig" aria-label="Carte ${num} ${let_}">${num} ${let_}</div>
        <div class="yn"><button class="choice" data-v="1">Oui</button><button class="choice" data-v="0">Non</button></div><div class="fb" aria-live="polite"></div>`;
      $$(".choice",root).forEach(b=>b.onclick=()=>{
        const good=(b.dataset.v==="1")===ans;
        $$(".choice",root).forEach(x=>x.disabled=true);
        b.classList.add(good?"good":"bad");if(good)ok++;
        $(".fb",root).innerHTML=good?`<span class="ok">✔ Bien !</span>`:`<span class="ko">✘ Raté : la réponse était « ${ans?"Oui":"Non"} »</span>`;
        i++;rule=1-rule;later(show,900);
      });
    }
    show();
    function end(){
      const n=ok>=11?3:ok>=8?2:1;
      endCard(root,{id:"switch",n,title:"Défi terminé !",lines:[`Bonnes réponses : <b>${ok} / ${TOTAL}</b>`],
        msg:"Astuce : avant de répondre, lis bien la couleur de la règle ! Passer d’une tâche à l’autre demande un petit effort.",replay:()=>initSwitch(root)});
    }
  }
}

const fmt=t=>Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
const mk=(cls,html)=>{const d=document.createElement("div");d.className=cls;d.innerHTML=html||"";return d};

function wTimer(s){
  const d=mk("w w-timer",`<div class="clock">${fmt(s.sec)}</div><div class="wbtn"><button class="big" data-a="go">▶ Démarrer</button><button class="big alt" data-a="rst" aria-label="Remettre à zéro">↺</button></div>`);
  let left=s.sec,run=false,h=null;const clk=$(".clock",d),go=$("[data-a=go]",d);
  const stop=()=>{if(h){clearInterval(h);timers.delete(h);h=null}run=false;go.textContent="▶ Reprendre"};
  go.onclick=()=>{if(left<=0)return;if(run)stop();else{run=true;go.textContent="⏸ Pause";h=every(()=>{left--;clk.textContent=fmt(left);if(left<=0){stop();clk.textContent="⏰ Temps écoulé !";clk.classList.add("flash")}},1000)}};
  $("[data-a=rst]",d).onclick=()=>{stop();left=s.sec;clk.textContent=fmt(left);clk.classList.remove("flash");go.textContent="▶ Démarrer"};
  return d;
}
function wStopwatch(){
  const d=mk("w w-timer",`<div class="clock">0:00</div><div class="wbtn"><button class="big" data-a="go">▶ Démarrer</button><button class="big alt" data-a="rst" aria-label="Remettre à zéro">↺</button></div>`);
  let t=0,run=false,h=null;const clk=$(".clock",d),go=$("[data-a=go]",d);
  const stop=()=>{if(h){clearInterval(h);timers.delete(h);h=null}run=false;go.textContent="▶ Reprendre"};
  go.onclick=()=>{if(run)stop();else{run=true;go.textContent="⏹ Arrêter";h=every(()=>{t++;clk.textContent=fmt(t)},1000)}};
  $("[data-a=rst]",d).onclick=()=>{stop();t=0;clk.textContent="0:00";go.textContent="▶ Démarrer"};
  return d;
}
function wReveal(s){
  const d=mk("w w-reveal",`<button class="big alt">${s.label||"Voir la réponse"}</button><div class="answer" hidden>${s.html}</div>`);
  const b=$("button",d),a=$(".answer",d);
  b.onclick=()=>{a.hidden=!a.hidden;b.setAttribute("aria-expanded",String(!a.hidden))};
  return d;
}
function wCues(s){
  const d=mk("w w-timer",`<div class="clock">${fmt(s.sec)}</div><div class="wbtn"><button class="big" data-a="go">▶ Démarrer</button><button class="big alt" data-a="rst" aria-label="Remettre à zéro">↺</button></div><div class="cuenote" aria-live="polite"></div><details class="plan"><summary>👩‍🏫 Plan de l’enseignant (ne pas montrer)</summary><ul>${s.cues.map(c=>`<li><b>${fmt(c.at)}</b> – ${c.txt}</li>`).join("")}</ul></details>`);
  let el=0,run=false,h=null;const clk=$(".clock",d),go=$("[data-a=go]",d),note=$(".cuenote",d);
  const stop=()=>{if(h){clearInterval(h);timers.delete(h);h=null}run=false;go.textContent="▶ Reprendre"};
  go.onclick=()=>{if(el>=s.sec)return;if(run)stop();else{run=true;go.textContent="⏸ Pause";h=every(()=>{
    el++;clk.textContent=fmt(s.sec-el);
    s.cues.forEach(c=>{if(c.at===el){note.textContent="• top : "+c.txt;later(()=>{note.textContent=""},7000)}});
    if(el>=s.sec){stop();clk.textContent="⏰ Temps écoulé !";clk.classList.add("flash")}},1000)}};
  $("[data-a=rst]",d).onclick=()=>{stop();el=0;clk.textContent=fmt(s.sec);clk.classList.remove("flash");note.textContent="";go.textContent="▶ Démarrer"};
  return d;
}
function wFind(){
  const d=mk("w w-find",`<div class="fg" role="img" aria-label="Grille de lettres d et b"></div><div class="wbtn"><button class="big alt" data-a="show">Montrer les b</button><button class="big" data-a="new">Nouvelle grille</button></div><p class="fgcount" hidden></p>`);
  const fg=$(".fg",d),cnt=$(".fgcount",d);let shown=false;
  function build(){
    const R=7,C=14,K=8,cells=Array(R*C).fill("d");shuffle([...cells.keys()]).slice(0,K).forEach(i=>cells[i]="b");
    fg.style.gridTemplateColumns=`repeat(${C},1fr)`;
    fg.innerHTML=cells.map(c=>`<span${c==="b"?' data-b="1"':""}>${c}</span>`).join("");
    shown=false;cnt.hidden=true;$("[data-a=show]",d).textContent="Montrer les b";
  }
  $("[data-a=show]",d).onclick=e=>{shown=!shown;$$("[data-b]",fg).forEach(x=>x.classList.toggle("hit",shown));cnt.hidden=!shown;cnt.textContent="Il y avait 8 b.";e.target.textContent=shown?"Cacher les b":"Montrer les b"};
  $("[data-a=new]",d).onclick=build;build();
  return d;
}
function wShape(){
  const d=mk("w w-shape",`<div class="shapebox"></div><div class="wbtn"><button class="big" data-a="new">Nouvelle figure</button><button class="big alt" data-a="hide">Masquer</button></div>`);
  const box=$(".shapebox",d);
  const cols=["#1b8fe0","#f26a1b","#9ec10f","#f9b61f","#e0413a"];
  function build(){
    const slots=shuffle([0,1,2,3,4,5]).slice(0,5),kinds=shuffle(["circle","square","tri","rect","circle","square","tri","rect"]),cs=shuffle(cols);
    let g="";
    slots.forEach((sl,i)=>{
      const cx=60+(sl%3)*100,cy=60+Math.floor(sl/3)*100,c=cs[i],k=kinds[i];
      if(k==="circle")g+=`<circle cx="${cx}" cy="${cy}" r="${rnd(22,34)}" fill="${c}"/>`;
      else if(k==="square"){const z=rnd(40,62);g+=`<rect x="${cx-z/2}" y="${cy-z/2}" width="${z}" height="${z}" fill="${c}"/>`}
      else if(k==="rect"){g+=`<rect x="${cx-38}" y="${cy-20}" width="76" height="40" fill="${c}"/>`}
      else{const z=rnd(30,38);g+=`<polygon points="${cx},${cy-z} ${cx+z},${cy+z*.8} ${cx-z},${cy+z*.8}" fill="${c}"/>`}
    });
    box.innerHTML=`<svg viewBox="0 0 320 220" role="img" aria-label="Figure géométrique à décrire"><rect x="1" y="1" width="318" height="218" fill="#fff" stroke="#17203d" stroke-width="2" rx="10"/>${g}</svg>`;
  }
  $("[data-a=new]",d).onclick=build;
  $("[data-a=hide]",d).onclick=e=>{box.hidden=!box.hidden;e.target.textContent=box.hidden?"Afficher":"Masquer"};
  build();return d;
}
function wLevels(s){
  const d=mk("w w-levels","");let i=0,shown=false;
  function draw(){
    if(i>=s.items.length){d.innerHTML=`<div class="lvcard"><p class="pq">Bravo, on a fait le tour ! ✔</p><button class="big" data-a="re">Recommencer</button></div>`;$("[data-a=re]",d).onclick=()=>{i=0;shown=false;draw()};return}
    const it=s.items[i];
    d.innerHTML=`<div class="lvcard"><div class="lvn">Activité ${i+1} / ${s.items.length}</div><p class="pq">${it.t}</p>${shown?`<div class="lvans"><svg class="gauge" viewBox="0 0 140 90">${gaugeInner(it.l)}</svg><div><b>Niveau ${it.l}</b><br>${it.why}</div></div><button class="big" data-a="nx">Suivante →</button>`:`<button class="big alt" data-a="rv">Révéler le niveau</button>`}</div>`;
    const rv=$("[data-a=rv]",d),nx=$("[data-a=nx]",d);
    if(rv)rv.onclick=()=>{shown=true;draw()};
    if(nx)nx.onclick=()=>{i++;shown=false;draw()};
  }
  draw();return d;
}
const WIDGETS={timer:wTimer,stopwatch:wStopwatch,reveal:wReveal,cues:wCues,findgrid:wFind,duoshape:wShape,levelcards:wLevels};

/* --- mission --- */
function viewMission(m){
  let ai=0,si=0,pz=1;
  const idx=MISSIONS.indexOf(m),next=MISSIONS[idx+1];
  app.innerHTML=topbar()+`<div class="mshell"><div class="mbar"><div><span class="badge">Mission ${m.num}</span><h2>${m.mystery}</h2></div><div class="mtools"><span id="achips"></span><button class="pbtn dark" id="zo" aria-label="Réduire le texte">A−</button><button class="pbtn dark" id="zi" aria-label="Agrandir le texte">A+</button></div></div><div id="pbody"></div><div class="pfoot"><button class="pbtn" id="pprev">← Précédent</button><b id="pcount"></b><button class="pbtn" id="pnext">Suivant →</button></div></div>`;
  const slides=()=>m.activities[ai].slides.concat([{disc:true}]);
  function chips(){
    const c=$("#achips");
    if(m.activities.length<2){c.innerHTML="";return}
    c.innerHTML=m.activities.map((a,k)=>`<button class="chip" data-k="${k}" aria-pressed="${k===ai}">Activité ${k+1} : ${a.titre}</button>`).join("");
    $$(".chip",c).forEach(b=>b.onclick=()=>{ai=+b.dataset.k;si=0;chips();show()});
  }
  function show(){
    stopAll();
    const sl=slides(),s=sl[si],body=$("#pbody");
    if(s.disc){
      const c=CONCEPTS[m.concept];markDone(m.id);
      body.innerHTML=`<h2 class="stitle">Ce que j’ai découvert</h2><div class="disc"><span class="ico">${c.icon}</span><h3>${c.name}</h3><div class="dbody">${c.html}</div></div><div class="wbtn dact">${m.game?`<a class="big" href="#/jeux/${m.game}">🎮 M’entraîner avec un jeu</a>`:""}${next?`<a class="big alt" href="#/m/${next.id}">Mission ${next.num} →</a>`:`<a class="big alt" href="#/synthese">🎓 Voir la synthèse →</a>`}<a class="big" href="#/">☰ Sommaire</a></div>`;
    }else{
      body.innerHTML=`<h2 class="stitle">${s.titre}</h2><div class="sbody">${s.html||""}</div>`;
      [].concat(s.w||[]).forEach(w=>{const f=WIDGETS[w.type];if(f)body.appendChild(f(w))});
    }
    fillGauges(body);
    $("#pcount").textContent=(si+1)+" / "+sl.length;
    $("#pprev").disabled=si===0;$("#pnext").disabled=si===sl.length-1;
    window.scrollTo(0,0);
  }
  const prev=()=>{if(si>0){si--;show()}},nxt=()=>{if(si<slides().length-1){si++;show()}};
  $("#pprev").onclick=prev;$("#pnext").onclick=nxt;
  const zoom=v=>{pz=Math.max(.7,Math.min(1.6,v));$(".mshell").style.setProperty("--pz",pz)};
  $("#zo").onclick=()=>zoom(pz-.15);$("#zi").onclick=()=>zoom(pz+.15);
  mnav={prev,nxt};chips();show();
}
document.addEventListener("keydown",e=>{
  if(!mnav||(e.target.matches&&e.target.matches("input,textarea")))return;
  if(e.key==="ArrowRight")mnav.nxt();else if(e.key==="ArrowLeft")mnav.prev();
});

/* --- jeux --- */
function viewGames(openId){
  app.innerHTML=topbar()+`<main class="wrap"><section><h2>Les jeux d’entraînement 🎮</h2><p class="lead">Choisis un jeu et gagne jusqu’à 3 étoiles ⭐. Tes étoiles sont gardées sur cet appareil.</p><div class="tabs" role="tablist" id="tabs"></div><div id="panels"></div></section></main>`;
  const tabs=$("#tabs"),panels=$("#panels");
  GAMES.forEach(g=>{
    const t=document.createElement("button");
    t.className="tab";t.id="tab-"+g.id;t.setAttribute("role","tab");t.setAttribute("aria-selected","false");
    t.innerHTML=`<span class="ti">${g.icon}</span><b>${g.name}</b><small>☆☆☆</small>`;
    const p=document.createElement("div");
    p.className="panel";p.id="panel-"+g.id;p.hidden=true;p.setAttribute("role","tabpanel");
    tabs.appendChild(t);panels.appendChild(p);
    t.onclick=()=>{
      stopAll();
      $$(".tab").forEach(x=>x.setAttribute("aria-selected","false"));
      $$(".panel").forEach(x=>x.hidden=true);
      t.setAttribute("aria-selected","true");p.hidden=false;
      if(g.intro){
        p.innerHTML=`<h3>${g.icon} ${g.name}</h3><div class="rules">${g.intro}</div><button class="big" id="go">Commencer</button>`;
        $("#go",p).onclick=()=>{p.innerHTML="";g.init(p)};
      }else g.init(p);
      p.scrollIntoView({behavior:"smooth",block:"nearest"});
    };
  });
  const o=openId&&$("#tab-"+openId);if(o)o.click();
}

/* --- pause --- */
function viewPause(){
  app.innerHTML=topbar()+`<main class="wrap"><section><h2>Ma pause « respiration » 🌬️</h2><p class="lead">Une bonne pause aide le cerveau à repartir. Suis le cercle : il grandit quand j’inspire, il rétrécit quand j’expire.</p><div class="panel breath" style="min-height:0"><div class="circle" id="circle" aria-live="polite">Prêt ?</div><p id="bmsg" style="margin-top:14px;font-weight:700"> </p><button class="big alt" id="bstart">Commencer (3 respirations)</button></div></section></main>`;
  const c=$("#circle"),m=$("#bmsg"),b=$("#bstart");
  b.onclick=()=>{
    b.disabled=true;
    for(let k=0;k<3;k++){
      later(()=>{c.classList.add("in");c.textContent="Inspire…";m.textContent="Respiration "+(k+1)+" / 3 : je gonfle mon ventre doucement"},k*8000);
      later(()=>{c.classList.remove("in");c.textContent="Expire…";m.textContent="Je souffle lentement, comme sur une bougie"},k*8000+4000);
    }
    later(()=>{c.textContent="Bravo !";m.textContent="Tes idées sont plus calmes. Tu peux reprendre ton travail.";b.disabled=false;b.textContent="Recommencer"},24000);
  };
}

/* --- synthèse --- */
function viewSynth(){
  const card=(k,cls)=>{const c=CONCEPTS[k];return `<article class="card ${cls||""}"><span class="ico">${c.icon}</span><h3>${c.name}</h3>${c.html}</article>`};
  app.innerHTML=topbar()+`<main class="wrap"><section><div class="noprint" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h2 style="margin:0">La synthèse 🎓</h2><button class="big alt" onclick="window.print()">🖨️ Imprimer</button></div><h2 class="printonly">Mission Attention – Synthèse</h2>
   <p class="lead">Tout ce qu’on a découvert sur l’attention.</p>
   <h2 style="margin-top:24px">Les 4 types d’attention</h2><div class="grid g4">${card("conjointe","t-conj")}${card("selective","t-sel")}${card("partagee","t-part")}${card("alternee","t-alt")}</div>
   <h2 style="margin-top:34px">Les degrés d’attention</h2><div class="grid g4">${card("niv1","lv1")}${card("niv2","lv2")}${card("niv3","lv3")}${card("alerte","alert")}</div>
   <h2 style="margin-top:34px">Mes stratégies</h2>${card("strategies")}
  </section></main>`;
  fillGauges(app);
}

/* --- routeur --- */
function route(){
  stopAll();mnav=null;
  const p=location.hash.replace(/^#\/?/,"").split("/");
  const m=p[0]==="m"&&MISSIONS.find(x=>x.id===p[1]);
  if(m)viewMission(m);
  else if(p[0]==="jeux")viewGames(p[1]);
  else if(p[0]==="pause")viewPause();
  else if(p[0]==="synthese")viewSynth();
  else viewHome();
  window.scrollTo(0,0);refreshStars();
}
window.addEventListener("hashchange",route);
route();
})();

</script>
